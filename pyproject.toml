[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gap-arrangement-dynamics"
version = "1.0.0"
description = "Reproducible simulations of gap arrangement in nonlocal particle transport"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Vangelis D. Karalis"}]
dependencies = ["numpy==2.3.5", "scipy==1.17.1", "matplotlib==3.10.9", "pillow==12.3.0"]
keywords = ["gap-arrangement-dynamics", "particle-dynamics", "interacting-particle-systems", "gap-diffusion", "two-scale-modeling", "nonlinear-diffusion", "wasserstein-distance", "scientific-computing", "mathematical-modeling"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
gap-arrangement = "gap_arrangement.cli:main"

[project.urls]
Repository = "https://github.com/vkaralis/gap-arrangement-dynamics"
Documentation = "https://github.com/vkaralis/gap-arrangement-dynamics#readme"

[tool.setuptools.packages.find]
where = ["src"]
